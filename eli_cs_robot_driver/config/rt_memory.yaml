controller_manager:
  ros__parameters:
    # Heap headroom (MiB) pre-faulted before the control loop starts, so
    # first-touch page faults for the process's working set happen at startup
    # rather than inside the real-time loop. With glibc M_TRIM_THRESHOLD=-1 (set
    # alongside the lock) this becomes a permanent RSS floor -- size it from the
    # peak RSS (VmHWM) reported by the periodic memory-footprint log plus
    # headroom, not by guessing.
    rt_memory.heap_reserve_mb: 100.0

    # Seconds between periodic page-fault / memory-footprint report log lines
    # from the control loop. <= 0 disables the monitor entirely.
    rt_memory.log_interval_sec: 30.0

    # Real-time SCHEDULING of the control loop thread (rt_sched.hpp). Both
    # default to the behaviour the node had before these parameters existed:
    # SCHED_FIFO 50, thread free to run on any allowed CPU. Production sets them
    # per node from the launch file so the two cyclic loops (arm, hose reel) sit
    # at distinct priorities on distinct cores; see the moveit repo's
    # robot_drivers_to_persist.launch.py.
    #
    # SCHED_FIFO priority, 1..98 (99 is the kernel's). Out of range -> WARN and 50.
    # rt_sched.priority: 50
    #
    # CPU to pin the loop thread to; -1 = leave affinity alone. A CPU outside the
    # container's cpuset is reported as a failed pin and the loop stays unpinned.
    # rt_sched.cpu: -1

    # Control loop TIMEBASE report (rt_timebase.hpp). The loop schedules on
    # CLOCK_MONOTONIC with absolute deadlines and records each cycle's measured
    # period, lateness and any overrun (a wake-up a full period or more late,
    # after which the grid restarts from "now" instead of bursting to catch up)
    # into lock-free counters. A wall timer on the executor thread logs one
    # "Control loop timing:" line per interval with n and the monotonic span of
    # those cycles ("n=1500 over 30.00 s"), min/mean/max/std of the period,
    # overruns, clamps (dt handed to the controllers capped at 10 periods) and
    # the largest lateness since the previous line. <= 0 disables the log line
    # only; the loop still counts. Caveat: the interval is a wall timer on the
    # executor and its cadence shifts with wall-clock steps (rmw waits on
    # CLOCK_REALTIME), e.g. a -1 s NTP step makes one window 7 s long. Everything
    # inside the line is monotonic and exact; read "over N s", not the cadence.
    rt_timebase.report_interval_sec: 30.0
