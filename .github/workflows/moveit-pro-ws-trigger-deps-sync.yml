name: MoveIt Pro Workspace - Trigger Dependency Sync

on:
  push:
    branches:
      - feature/moveit_pro

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-deps:
    uses: getdevopspro/github-actions/.github/workflows/pr-create.yml@v6.7.1
    secrets:
      token: ${{ secrets.BOT_REPO_TOKEN }}
      ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    with:
      repository: ${{ github.repository_owner }}/moveit
      ref: main
      lfs: true
      just-install: true
      command: just deps-sync
      branch: create-pull-request/sync-deps-from-elite-driver-repo
      committer: cleanbotix-cibot <286146176+cleanbotix-cibot@users.noreply.github.com>
      author: cleanbotix-cibot <286146176+cleanbotix-cibot@users.noreply.github.com>
      commit-message: |-
        ci: sync external dependencies

        From repo '${{ github.repository }}' in workflow '${{ github.workflow }}'
      title: Sync external dependencies from ${{ github.repository }}
      body: This PR was automatically generated to keep dependencies up to date. It was created by the workflow `${{ github.workflow }}` in the repository `${{ github.repository }}`.
